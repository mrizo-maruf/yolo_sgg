# ============================================================================
# ScanNet++ dataset overrides
# ============================================================================
# Inherits everything from core_tracking.yaml; override only what differs.

dataset: scanetpp

# --- ScanNet++ camera intrinsics ---
fx: 692.52
fy: 693.83
cx: 459.76
cy: 344.76
image_width: 920
image_height: 690

# --- Depth conversion (uint16 PNG, metres = px / 1000) ---
depth_scale: 1000.0
min_depth: 0.01
max_depth: 10.0

# ScanNet++ labels to skip in GT loading
loader_skip_labels:
  - wall
  - floor
  - ground
  - ceiling
  - background

load_rgb: true
load_depth: false
pi3: false
dav3: false
require_all_ids: true

# --- Offline Pi3 depth (for depth_provider: pi3_offline) ---
# Pi3 output dir from Pi3_for_yolo_sgg/run.py
pi3_offline_depth_dir: "pi3_depth"
# Pi3 camera poses saved by Pi3_for_yolo_sgg/run.py
pi3_offline_pose_path: "pi3_camera_poses.txt"
# Scene-level Sim(3) from align_pi3_gt.py --save_transform
pi3_offline_transform_path: "pi3_to_world_transform.json"
# If null, provider reads png_depth_scale from pi3_depth/pi3_depth_meta.txt
pi3_offline_png_depth_scale: null
pi3_offline_require_transform: true
pi3_offline_pose_lookup_mode: auto

# --- Online Pi3 depth (for depth_provider: pi3_online) ---
pi3_online_transform_path: "pi3_to_world_transform.json"
pi3_online_require_transform: false


save_graph_dir: "results/scene_graphs"
benchmark_metrics_path: "./results/scanetpp_metrics/"

